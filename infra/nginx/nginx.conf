# ==============================================================================
# TAMPARAN ANAK MUDA — PRODUCTION LOAD BALANCER (NGINX)
# Arsitektur : Layer 7 Reverse Proxy & Load Balancer
# Metode     : least_conn (Metode Terbaik untuk Next.js SSR & API)
# ==============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 8192;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # --------------------------------------------------------------------------
    # 1. Performance & Kernel Tuning (Agar Tidak Membebani CPU Server)
    # --------------------------------------------------------------------------
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens off;

    # Client body limits
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # --------------------------------------------------------------------------
    # 2. Gzip Compression (Menghemat Bandwidth & Meringankan Pengiriman Data)
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    # --------------------------------------------------------------------------
    # 3. Rate Limiting Zones (Mencegah Server Jebol karena Spike / DDoS)
    # --------------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=tam_page_limit:20m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=tam_api_limit:20m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=tam_conn_limit:20m;

    # --------------------------------------------------------------------------
    # 4. Microcaching Zone (SSR Page Cache: Kunci Utama Server Ringan)
    #    Jika ada 1.000 user akses homepage/artikel bersamaan, Node.js hanya render 1x,
    #    sisanya dilayani instan dari RAM/Disk Nginx (0% CPU Next.js).
    # --------------------------------------------------------------------------
    proxy_cache_path /var/cache/nginx/tam_microcache
                     levels=1:2
                     keys_zone=TAM_MICROCACHE:50m
                     max_size=1g
                     inactive=30m
                     use_temp_path=off;

    # --------------------------------------------------------------------------
    # 5. UPSTREAM CLUSTER (Next.js Application Replicas)
    #
    # METODE TERBAIK: least_conn (Least Connections)
    #
    # Mengapa least_conn adalah metode terbaik untuk Next.js?
    # - Round-Robin biasa membagi request berurutan tanpa peduli beban (server yang
    #   sedang memproses request berat tetap dihantam request baru -> CPU jebol).
    # - least_conn secara cerdas mengarahkan request BARU HANYA ke server yang memiliki
    #   koneksi aktif PALING SEDIKIT pada milidetik tersebut.
    # - Dilengkapi passive health-check (max_fails=3 fail_timeout=10s) agar traffic
    #   otomatis berpindah jika salah satu instance mati/hang.
    # --------------------------------------------------------------------------
    upstream nextjs_cluster {
        least_conn;

        # Node instances (bisa multi-port lokal, container Docker, atau multi-VPS IP)
        server app_1:3000 max_fails=3 fail_timeout=10s weight=1;
        server app_2:3000 max_fails=3 fail_timeout=10s weight=1;
        server app_3:3000 max_fails=3 fail_timeout=10s weight=1;

        # Keepalive reuse: Menghindari beban CPU dari TCP handshake berulang
        keepalive 64;
    }

    # --------------------------------------------------------------------------
    # HTTP Server (Port 80) -> Force Redirect ke HTTPS
    # --------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name tamparananakmuda.com www.tamparananakmuda.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --------------------------------------------------------------------------
    # HTTPS Server (Port 443) -> Load Balanced Proxy
    # --------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name tamparananakmuda.com www.tamparananakmuda.com;

        # SSL Certificates (Let's Encrypt / Cloudflare Origin Cert)
        ssl_certificate /etc/letsencrypt/live/tamparananakmuda.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/tamparananakmuda.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:20m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Strict Security Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # Batasi koneksi simultan per IP (mencegah scraper memonopoli server)
        limit_conn tam_conn_limit 30;

        # ----------------------------------------------------------------------
        # A. Next.js Static Assets (_next/static)
        #    SANGAT PENTING: Jangan biarkan aset statis membebani Node.js!
        #    Cache 1 tahun (immutable) di browser & Nginx.
        # ----------------------------------------------------------------------
        location /_next/static/ {
            proxy_pass http://nextjs_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            expires 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # ----------------------------------------------------------------------
        # B. Media Statis Publik (Gambar, Font, SVG, Favicon)
        # ----------------------------------------------------------------------
        location ~* \.(?:jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff2|woff|ttf)$ {
            proxy_pass http://nextjs_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
            access_log off;
        }

        # ----------------------------------------------------------------------
        # C. API Endpoints (Bypass Cache, Strict Rate-Limit)
        # ----------------------------------------------------------------------
        location /api/ {
            limit_req zone=tam_api_limit burst=20 nodelay;

            proxy_pass http://nextjs_cluster;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Disable caching for dynamic APIs
            proxy_cache_bypass 1;
            proxy_no_cache 1;

            # Proteksi timeout agar koneksi gantung tidak memakan pool
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        # ----------------------------------------------------------------------
        # D. Health Check Endpoint (Untuk Monitoring LB Eksternal)
        # ----------------------------------------------------------------------
        location /healthz {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # ----------------------------------------------------------------------
        # E. Halaman Utama & SSR (Load Balanced least_conn + Microcache)
        # ----------------------------------------------------------------------
        location / {
            limit_req zone=tam_page_limit burst=50 nodelay;

            proxy_pass http://nextjs_cluster;
            proxy_http_version 1.1;

            # Headers penerusan
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Microcaching: Cache SSR selama 30 detik untuk user publik
            # User login/auth otomatis bypass microcache
            proxy_cache TAM_MICROCACHE;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_valid 200 30s;
            proxy_cache_valid 404 1m;

            # Bypass cache jika ada cookie login/session Supabase atau header khusus
            proxy_cache_bypass $http_authorization $cookie_sb_access_token $cookie_session;
            proxy_no_cache $http_authorization $cookie_sb_access_token $cookie_session;

            # Debug header untuk melihat status cache (HIT / MISS / EXPIRED)
            add_header X-Cache-Status $upstream_cache_status always;
            add_header X-LB-Algorithm "least_conn" always;
        }
    }
}
