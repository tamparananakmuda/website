version: '3.8'

# ==============================================================================
# TAMPARAN ANAK MUDA — DOCKER COMPOSE HIGH-AVAILABILITY CLUSTER
# Load Balancer: Nginx (least_conn algorithm)
# Backend Nodes: 3 Next.js Replicas
# ==============================================================================

services:
  # Next.js Application Instance 1
  app_1:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
    env_file:
      - ../.env.local
    expose:
      - "3000"

  # Next.js Application Instance 2
  app_2:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
    env_file:
      - ../.env.local
    expose:
      - "3000"

  # Next.js Application Instance 3
  app_3:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
    env_file:
      - ../.env.local
    expose:
      - "3000"

  # High-Performance Nginx Load Balancer (least_conn)
  loadbalancer:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app_1
      - app_2
      - app_3
